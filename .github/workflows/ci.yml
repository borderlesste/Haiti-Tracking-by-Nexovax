name: Verify
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  security:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install detect-secrets==1.5.0 bandit==1.9.4 pip-audit==2.10.1
      - run: python scripts/check-secrets.py
      - run: bandit -r apps/api/app -q
      - run: pip-audit -r apps/api/requirements.txt --disable-pip --no-deps
  web:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm test && pnpm test:sites && pnpm build
        working-directory: apps/web
      - run: pnpm audit --audit-level high
        working-directory: apps/web
  api:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: haiti_test
          POSTGRES_USER: haiti_ci
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haiti_ci -d haiti_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install -r requirements-test.txt && pip check
        working-directory: apps/api
      - run: python -m pytest -q
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgresql+psycopg://haiti_ci:ci-only-not-a-production-secret@localhost:5432/haiti_test
          APP_ENV: test
