# Isolated local verification ports; use with -p haiti-tracking-verify.
services:
  db:
    ports: !override ["127.0.0.1:55433:5432"]
  api:
    ports: !override ["127.0.0.1:8002:8000"]
    environment:
      WEB_BASE_URL: http://127.0.0.1:4174
      ALLOWED_ORIGINS: http://127.0.0.1:4174
  web:
    ports: !override ["127.0.0.1:4174:8080"]
